data:
  batch_size: 16
  image_size: 224
  mean:
  - 0.485
  - 0.456
  - 0.406
  num_workers: 2
  std:
  - 0.229
  - 0.224
  - 0.225
  test_split: 0.1
  val_split: 0.2

model:
  backbone: densenet121
  classes:
  - NORMAL
  - PNEUMONIA
  dropout: 0.2
  num_classes: 2
  pretrained: true
  target_layer: features.denseblock4.denselayer16.conv2

paths:
  best_model_path: checkpoints/best_densenet121.pth
  checkpoint_dir: checkpoints
  data_dir: data/chest_xray
  reports_dir: reports
  sample_dir: data/sample_images

training:
  device: auto
  early_stopping_patience: 5
  epochs: 15
  learning_rate: 0.0001
  scheduler: ReduceLROnPlateau
  scheduler_patience: 2
  seed: 42
  weight_decay: 0.0001
